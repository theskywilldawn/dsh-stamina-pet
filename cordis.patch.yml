# dsh-stamina-pet（大肥鱼体力条）
#
# 只新增自己的一行 entry，**不接管任何官方包**。
# 数据全部落在 $DSH_HOME/stamina-pet/ 下（**不在插件包目录里**，升级不会连根删）：
#   config.json   设置卡片写的那份（热读，改完下一步生效）
#   daily.json    每个会话今天的提醒次数（防刷屏）
#   state.json    预留（运行时状态目前只在内存里）
#
# 不需要时，从 profile 的 bundles 里删掉本行即可完全恢复，零残留。
- insert:
    - id: stamina-pet
      name: dsh-stamina-pet
